<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>변수 2</title>

    <style>
        span{
            color: red;
        }
    </style>
  </head>
  <body>
    <script>
      //변수 연산
      let x = 200;
      let y = 50;
      // 더하기
      let total = x + y; // % / + - * 가능  (%는 나머지값)
      // 곱하기
      let total2 = x * y;
      console.log(total);
      document.write(`<p>x 와 y 를 더한 값은 ${total} </p>`);
      document.write(`<p>x 와 y 를 곱한 값은 <span> ${total2} </p>`);
    </script>
  </body>
</html>
